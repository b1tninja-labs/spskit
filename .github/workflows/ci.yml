name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: spskit
    steps:
      - uses: actions/checkout@v4
        with:
          path: spskit

      # spskit depends on the sibling udskit crate by the path `../udskit`, the same layout the
      # D:\code workspace uses locally. Check out udskit's default branch beside spskit so the path
      # dependency resolves. Both repos are public, so the default token is enough.
      - name: check out the udskit path dependency
        uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/udskit
          path: udskit

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      - name: doc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spskit
    steps:
      - uses: actions/checkout@v4
        with:
          path: spskit
      - name: check out the udskit path dependency
        uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/udskit
          path: udskit
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo test
