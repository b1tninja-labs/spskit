[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spskit"
dynamic = ["version"]
description = "Build the GM SPS2 programming request: the VIT1 getProgrammingData body and the J2534 wrapper connect string. The TDS/Techline Connect client (sign-in, downloads, SPS Info) is techlinekit; the dongle is vcxtoolkit."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Justin Capella" }]
keywords = ["sps2", "tds", "obd", "j2534"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
# techlinekit is a workspace sibling (D:\code\techlinekit), not yet published; it is put on the
# import path by pytest `pythonpath` and mypy `mypy_path` below rather than resolved from PyPI.
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
spskit-vit1 = "spskit.handoff:main"

[tool.hatch.version]
path = "spskit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["spskit"]

[tool.hatch.build.targets.sdist]
include = ["/spskit/", "/tests/", "/docs/", "/README.md", "/ROADMAP.md", "/PLAN.md", "/LICENSE", "/.env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../techlinekit"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "N", "UP", "SIM", "C4", "PT", "RUF", "S", "RET", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
mypy_path = "../techlinekit"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
